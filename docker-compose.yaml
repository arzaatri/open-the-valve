services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: otv
      POSTGRES_PASSWORD: otv
      POSTGRES_DB: open_the_valve
    ports:
      - "5433:5432"
    volumes:
      - otv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otv"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - postgres
    ports:
      - "3001:3000"
    environment:
      # ponytail: anonymous viewer access, fine for a local single-machine
      # demo; add real auth before this ever leaves localhost.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  otv_pgdata:
