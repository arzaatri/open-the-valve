name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: otv
          POSTGRES_PASSWORD: otv
          POSTGRES_DB: open_the_valve
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U otv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ITAD_API_KEY: ci-dummy
      IGDB_CLIENT_ID: ci-dummy
      IGDB_CLIENT_SECRET: ci-dummy
      TEST_DATABASE_URL: postgresql+psycopg://otv:otv@localhost:5433/open_the_valve

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Alembic upgrade head
        run: uv run alembic -c src/open_the_valve/db/migrations/alembic.ini upgrade head

      - name: Pytest
        run: uv run pytest
